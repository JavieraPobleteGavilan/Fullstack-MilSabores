<!DOCTYPE html>
<html lang="es" data-base="../" data-roles="Administrador,Vendedor">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Dashboard | Administrador Mil Sabores</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin">
    <aside class="admin-menu" id="admin-menu" aria-label="Menú del administrador">
      <a class="logo" href="index.html">
        <img src="../img/logo.svg" alt="" width="42" height="42">
        <span>Mil Sabores<small>ADMINISTRADOR</small></span>
      </a>
      <nav aria-label="Secciones del panel">
        <ul><li data-roles="Administrador,Vendedor"><a href="index.html" aria-current="page"><span class="icono" aria-hidden="true">📊</span>Dashboard</a></li><li data-roles="Administrador,Vendedor"><a href="ordenes.html"><span class="icono" aria-hidden="true">🧾</span>Órdenes</a></li><li data-roles="Administrador,Vendedor"><a href="productos.html"><span class="icono" aria-hidden="true">🎂</span>Productos</a></li><li data-roles="Administrador"><a href="usuarios.html"><span class="icono" aria-hidden="true">👥</span>Usuarios</a></li></ul>
      </nav>
      <div class="abajo">
        <ul>
          <li><a href="../index.html"><span class="icono" aria-hidden="true">🏪</span>Ver tienda</a></li>
          <li><button type="button" class="link-menu" id="admin-salir"><span class="icono" aria-hidden="true">🚪</span>Cerrar sesión</button></li>
        </ul>
        <p class="perfil-admin" id="perfil-admin"></p>
      </div>
    </aside>
    <main class="admin-contenido" id="contenido">
      <header class="admin-cabecera">
        <button class="btn btn-borde btn-chico admin-toggle" type="button" aria-controls="admin-menu" aria-expanded="false">☰ Menú</button>
        <h1 id="saludo">¡Hola!</h1>
        <span class="texto-secundario" id="fecha-hoy"></span>
      </header>
      <section class="estadisticas" aria-label="Resumen" id="estadisticas"></section>
      <section class="panel" aria-labelledby="titulo-alertas">
        <h2 id="titulo-alertas">Alertas de stock crítico</h2>
        <div id="alertas-stock"></div>
      </section>
      <section class="panel" aria-labelledby="titulo-ultimas">
        <h2 id="titulo-ultimas">Últimas órdenes</h2>
        <div class="tabla-scroll" id="ultimas-ordenes"></div>
      </section>

    </main>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
