<!DOCTYPE html>
<html lang="es" data-base="../" data-roles="Administrador">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Usuarios | Administrador Mil Sabores</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin">
    <aside class="admin-menu" id="admin-menu" aria-label="Menú del administrador">
      <a class="logo" href="index.html">
        <img src="../img/logo.svg" alt="" width="42" height="42">
        <span>Mil Sabores<small>ADMINISTRADOR</small></span>
      </a>
      <nav aria-label="Secciones del panel">
        <ul><li data-roles="Administrador,Vendedor"><a href="index.html"><span class="icono" aria-hidden="true">📊</span>Dashboard</a></li><li data-roles="Administrador,Vendedor"><a href="ordenes.html"><span class="icono" aria-hidden="true">🧾</span>Órdenes</a></li><li data-roles="Administrador,Vendedor"><a href="productos.html"><span class="icono" aria-hidden="true">🎂</span>Productos</a></li><li data-roles="Administrador"><a href="usuarios.html" aria-current="page"><span class="icono" aria-hidden="true">👥</span>Usuarios</a></li></ul>
      </nav>
      <div class="abajo">
        <ul>
          <li><a href="../index.html"><span class="icono" aria-hidden="true">🏪</span>Ver tienda</a></li>
          <li><button type="button" class="link-menu" id="admin-salir"><span class="icono" aria-hidden="true">🚪</span>Cerrar sesión</button></li>
        </ul>
        <p class="perfil-admin" id="perfil-admin"></p>
      </div>
    </aside>
    <main class="admin-contenido" id="contenido">
      <header class="admin-cabecera">
        <button class="btn btn-borde btn-chico admin-toggle" type="button" aria-controls="admin-menu" aria-expanded="false">☰ Menú</button>
        <h1>Usuarios</h1>
        <a class="btn" href="usuario-form.html">+ Nuevo usuario</a>
      </header>
      <section class="panel">
        <div class="herramientas">
          <label for="buscar-usuario" class="oculto-visual">Buscar usuario</label>
          <input type="search" id="buscar-usuario" placeholder="Buscar por RUN, nombre o correo">
          <label for="filtro-tipo" class="oculto-visual">Tipo de usuario</label>
          <select id="filtro-tipo"><option value="">Todos los tipos</option></select>
        </div>
        <div class="tabla-scroll">
          <table class="tabla">
            <thead><tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Tipo</th><th>Comuna</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-usuarios"></tbody>
          </table>
        </div>
        <nav class="paginacion" id="paginacion-usuarios" aria-label="Paginación"></nav>
      </section>

    </main>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
